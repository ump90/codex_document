site_name: Codex 官方文档中文翻译
site_description: OpenAI Codex 官方文档中文翻译与英文快照
repo_url: https://github.com/ump90/codex_document
repo_name: ump90/codex_document
docs_dir: docs
site_dir: site
not_in_nav: |
  source/pages/**
  zh/pages/**
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    anchors: ignore
theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
extra_css:
  - stylesheets/openai-codex.css
nav:
  - 首页: index.md
  - 中文分页目录: zh/README.md
  - 中文合订版: codex-manual.zh.md
  - 英文官方快照: source/codex-manual.en.md
  - 官方快照目录轮廓: source/codex-manual.outline.md
plugins:
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - fenced_code
  - sane_lists
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
extra:
  codex_nav:
    - title: Getting Started
      items:
        - title: Overview
          url: zh/pages/01-codex/
        - title: Quickstart
          url: zh/pages/04-quickstart/
        - title: Explore use cases
          url: zh/pages/97-use-cases/
        - title: Migrate
          url: zh/pages/75-migrate-to-codex/
        - title: Pricing
          url: zh/pages/02-codex-pricing/
        - title: Concepts
          url: zh/pages/05-best-practices/
    - title: Using Codex
      items:
        - title: App
          url: zh/pages/44-codex-app/
        - title: IDE Extension
          url: zh/pages/46-codex-ide-extension/
        - title: CLI
          url: zh/pages/45-codex-cli/
          children:
            - title: Overview
              url: zh/pages/45-codex-cli/
            - title: Features
              url: zh/pages/30-codex-cli-features/
            - title: Command Line Options
              url: zh/pages/22-cli-command-reference/
            - title: Slash commands
              url: zh/pages/39-slash-commands-in-codex-cli/
        - title: Web
          url: zh/pages/47-codex-web/
        - title: Integrations
          url: zh/pages/53-model-context-protocol/
        - title: Codex Security
          url: zh/pages/71-codex-security/
    - title: Configuration
